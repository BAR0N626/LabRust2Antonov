[package]
name = "image_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
aws-config = "1"
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"
rayon = "1.10"