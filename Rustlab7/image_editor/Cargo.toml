[package]
name = "image_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aws-config = "1"
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
thiserror = "2"
rayon = "1.10"
futures = "0.3"
async-trait = "0.1"